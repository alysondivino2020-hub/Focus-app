name: Gerar APK Android

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: focus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: FOCUS APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: projeto/FOCUS/android

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: projeto/FOCUS/android/**/*.gradle*

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verificar versão do Java
        run: java -version

      - name: Dar permissão ao Gradle
        run: chmod +x gradlew

      - name: Compilar APK Android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/FOCUS.apk

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: FOCUS-APK
          path: projeto/FOCUS/android/app/build/outputs/apk/debug/FOCUS.apk
          if-no-files-found: error
          retention-days: 30
