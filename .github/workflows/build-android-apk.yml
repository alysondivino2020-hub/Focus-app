name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: focus-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: FOCUS APK instalável
    runs-on: ubuntu-latest
    timeout-minutes: 30

   steps:
  - name: Baixar projeto
    uses: actions/checkout@v4

  - name: Configurar Java 21
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'
      cache: gradle

  - name: Dar permissão ao Gradle
    working-directory: projeto/FOCUS/android
    run: chmod +x gradlew

  - name: Compilar APK Android
    working-directory: projeto/FOCUS/android
    run: ./gradlew --no-daemon assembleDebug
